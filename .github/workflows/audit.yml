name: audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.14"
          enable-cache: false
      - name: Export the locked runtime requirements
        run: uv export --locked --no-dev --no-emit-project --quiet >"$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit them
        run: uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/runtime-requirements.txt"
